<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0f0f0f"/>
<title>Expense Tracker</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%0A%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%230f0f0f%22/%3E%0A%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2234%22%20fill%3D%22none%22%20stroke%3D%22%239772da%22%20stroke-width%3D%226%22/%3E%0A%3Ctext%20x%3D%2250%22%20y%3D%2264%22%20text-anchor%3D%22middle%22%20font-size%3D%2238%22%20font-weight%3D%22600%22%20fill%3D%22%239772da%22%20font-family%3D%22Arial%2C%20sans-serif%22%3E%E2%82%B9%3C/text%3E%0A%3C/svg%3E"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%0A%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%230f0f0f%22/%3E%0A%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2234%22%20fill%3D%22none%22%20stroke%3D%22%239772da%22%20stroke-width%3D%226%22/%3E%0A%3Ctext%20x%3D%2250%22%20y%3D%2264%22%20text-anchor%3D%22middle%22%20font-size%3D%2238%22%20font-weight%3D%22600%22%20fill%3D%22%239772da%22%20font-family%3D%22Arial%2C%20sans-serif%22%3E%E2%82%B9%3C/text%3E%0A%3C/svg%3E"/>
<link rel="manifest" href="manifest.json"/>
<style>
  :root {
    --bg: #f5f4fc;
    --surface: #ffffff;
    --surface2: #ede9f8;
    --border: #d8d0f0;
    --text: #1a1530;
    --text-secondary: #3d3560;
    --muted: #4a4370;
    --faint: #8a83aa;
    --accent: #7f54c9;
    --accent-dim: #6a41af;
    --accent-text: #ffffff;
    --red: #c0392b;
    --red-bg: #fdf0f0;
    --amber: #92400e;
    --amber-bg: #fef9ec;
    --green: #166534;
    --green-bg: #f0faf4;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }

  /* ── Mobile: full-width phone layout ── */
  .app { width: 100%; }
  .mobile-only { display: block; }
  .desktop-only { display: none !important; }
  .mobile-inner { max-width: 480px; margin: 0 auto; padding: 0 0 6rem; }

  /* ── Laptop layout (≥768px) ── */
  @media (min-width: 768px) {
    body { overflow: hidden; height: 100vh; }
    .app { display: flex; height: 100vh; overflow: hidden; }
    .mobile-only { display: none !important; }
    .desktop-only { display: flex !important; }

    /* Sidebar */
    .sidebar {
      width: 280px; flex-shrink: 0; background: var(--surface);
      border-right: 1px solid var(--border); display: flex !important;
      flex-direction: column; padding: 1.25rem; gap: 1rem;
      height: 100vh; overflow-y: auto;
    }
    /* Main panel */
    .main-panel {
      flex: 1; padding: 1.5rem; overflow-y: auto; background: var(--bg);
      display: flex !important; flex-direction: column; gap: 1rem;
      height: 100vh;
    }
    .desktop-metrics { display: grid !important; grid-template-columns: repeat(4,1fr); gap: 10px; }
    .desktop-charts  { display: grid !important; grid-template-columns: 1fr 1fr; gap: 10px; }
    .desktop-trend   { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
    .sidebar-nav     { border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
    .nav-item        { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--muted); cursor: pointer; border: none; background: none; width: 100%; text-align: left; transition: all .15s; }
    .nav-item:hover  { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--surface2); color: var(--accent); font-weight: 500; }
    .sidebar-recents { flex: 1; overflow-y: auto; min-height: 0; }
  }

  /* ── Input ── */
  .input-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 4px 4px 14px; display: flex; align-items: center; gap: 8px; margin: 0 1rem 1rem; transition: border-color .15s; }
  .input-wrap:focus-within { border-color: var(--accent); }
  .input-wrap input { flex: 1; background: none; border: none; outline: none; font-size: 16px; color: var(--text); padding: 8px 0; }
  .input-wrap input::placeholder { color: var(--faint); font-size: 15px; }
  .add-btn { background: var(--accent); color: var(--accent-text); border: none; border-radius: 7px; width: 38px; height: 38px; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 300; flex-shrink: 0; transition: background .15s; }
  .add-btn:hover { background: var(--accent-dim); }
  .add-btn:active { transform: scale(0.95); }

  /* ── Quick chips ── */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 1rem 0.5rem; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; font-size: 12px; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); background: var(--surface); cursor: pointer; white-space: nowrap; transition: all .12s; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Toast result ── */
  .log-result { margin: 0 1rem 0.75rem; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; display: none; }
  .log-result.matched { background: var(--green-bg); border: 1px solid #1a4a2e; color: var(--green); }
  .log-result.unmatched { background: var(--amber-bg); border: 1px solid #4a3010; color: var(--amber); }

  /* ── Metrics ── */
  .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 0 1rem 1rem; }
  .metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .metric-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .metric-val { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .metric-val.accent { color: var(--accent); }

  /* ── Tabs ── */
  .tabs { display: flex; padding: 0 1rem; gap: 4px; margin-bottom: 1rem; }
  .tab { flex: 1; padding: 8px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--muted); cursor: pointer; text-align: center; transition: all .15s; position: relative; }
  .tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 500; }
  .tab .badge { position: absolute; top: -6px; right: -6px; background: var(--red); color: #fff; font-size: 10px; min-width: 18px; height: 18px; border-radius: 99px; display: none; align-items: center; justify-content: center; font-weight: 600; }
  .tab .badge.show { display: flex; }

  /* ── Expense rows ── */
  .exp-list { padding: 0 1rem; }
  .exp-row { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .exp-row:last-child { border-bottom: none; }
  .exp-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .exp-body { flex: 1; min-width: 0; }
  .exp-raw { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exp-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .exp-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .exp-amt { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; font-weight: 500; }
  .pill-food { background: #dcfce7; color: #166534; }
  .pill-groceries { background: #d1fae5; color: #065f46; }
  .pill-transport { background: #dbeafe; color: #1e40af; }
  .pill-utilities { background: #f1f5f9; color: #475569; }
  .pill-shopping { background: #fae8ff; color: #86198f; }
  .pill-transfers { background: #fef3c7; color: #92400e; }
  .pill-health { background: #fee2e2; color: #991b1b; }
  .pill-entertainment { background: #ede9fe; color: #5b21b6; }
  .pill-personal { background: #ffedd5; color: #9a3412; }
  .pill-uncat { background: #f3f4f6; color: #6b7280; }
  .del-btn { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 16px; padding: 2px; line-height: 1; }
  .del-btn:hover { color: var(--red); }

  /* ── Uncategorized teach panel ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .teach-card { background: var(--surface); border: 1px solid var(--amber); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .teach-raw { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
  .teach-amt { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .teach-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .word-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .word-chip { font-size: 13px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); background: var(--surface2); cursor: pointer; transition: all .12s; }
  .word-chip.active { border-color: var(--accent); color: var(--accent); background: #ede9f8; }
  .selects { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .selects select { flex: 1; min-width: 130px; font-size: 13px; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2); color: var(--text); outline: none; cursor: pointer; }
  .selects select:focus { border-color: var(--accent); }
  .new-input-wrap input { width: 100%; font-size: 13px; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--accent); background: var(--surface2); color: var(--text); outline: none; }
  .date-row { display: flex; gap: 6px; margin: 0 1rem 0.75rem; align-items: center; }
  .date-chip { font-size: 12px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; transition: all .12s; white-space: nowrap; }
  .date-chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 500; }
  .date-picker-wrap { position: relative; flex-shrink: 0; }
  .date-picker-wrap input[type="date"] { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; top: 0; left: 0; }
  .similar-hint { margin-top: 6px; padding: 8px 10px; background: var(--amber-bg); border: 1px solid #4a3010; border-radius: var(--radius-sm); font-size: 12px; color: var(--amber); display: none; }
  .similar-hint.show { display: block; }
  .similar-hint button { background: var(--accent); color: var(--accent-text); border: none; border-radius: 5px; padding: 3px 9px; font-size: 11px; cursor: pointer; margin-left: 6px; font-weight: 500; }
  .similar-hint .use-new { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .teach-actions { display: flex; gap: 8px; }
  .teach-btn { flex: 1; padding: 9px; font-size: 13px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-weight: 500; transition: all .15s; }
  .teach-btn.save { background: var(--accent); color: var(--accent-text); }
  .teach-btn.save:hover { background: var(--accent-dim); }
  .teach-btn.skip { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

  /* ── Learned rules ── */
  .rules-list { padding: 0 1rem; }
  .rule-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .rule-row:last-child { border-bottom: none; }
  .rule-keyword { font-size: 13px; font-weight: 600; color: var(--accent); min-width: 90px; }
  .rule-arrow { color: var(--faint); font-size: 13px; }
  .rule-cat { font-size: 13px; color: var(--muted); flex: 1; }
  .export-btn { display: flex; align-items: center; gap: 6px; margin: 1rem 1rem 0; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-size: 13px; cursor: pointer; width: calc(100% - 2rem); justify-content: center; transition: all .15s; }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Empty states ── */
  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 14px; }
  .empty-icon { font-size: 32px; margin-bottom: 8px; }

  /* ── Bottom nav feel ── */
  .bottom-space { height: 2rem; }

  /* ── Snackbar ── */
  #snackbar { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 13px; padding: 10px 18px; border-radius: 99px; white-space: nowrap; z-index: 999; opacity: 0; transition: all .25s; pointer-events: none; }
  #snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #snackbar.green { border-color: var(--accent); color: var(--accent); }

  /* ── Setup banner ── */
  .setup-banner { margin: 0 1rem 1rem; padding: 12px 14px; background: var(--amber-bg); border: 1px solid #fcd34d; border-radius: var(--radius); font-size: 13px; color: var(--amber); }
  .setup-banner a { color: var(--accent); text-decoration: none; }
  .setup-input { margin-top: 8px; display: flex; gap: 6px; }
  .setup-input input { flex: 1; font-size: 13px; padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2); color: var(--text); outline: none; }
  .setup-input button { font-size: 13px; padding: 7px 14px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: var(--accent-text); cursor: pointer; font-weight: 500; }
</style>
</head>
<body>

<div class="app" id="appContent">

  <!-- Desktop sidebar (hidden on mobile via CSS) -->
  <div class="sidebar desktop-only" id="desktopSidebar">
    <div class="header" style="padding:0;margin-bottom:0">
      <div>
        <div class="header-title">Expense Tracker</div>
        <div class="header-sub" id="dateLabelDesktop"></div>
      </div>
      <button id="syncBtnDesktop" onclick="forceSyncFromSheet()" style="font-size:12px;padding:5px 14px;border-radius:99px;border:none;background:#ddd;color:#888;cursor:pointer;font-weight:500;transition:all .3s">⟳ Sync</button>
    </div>

    <div class="setup-banner" id="setupBannerDesktop" style="display:none;margin:0;font-size:12px">
      ⚙️ Paste your Apps Script URL to sync.
      <div class="setup-input" style="margin-top:6px">
        <input id="scriptUrlInputDesktop" type="url" placeholder="https://script.google.com/macros/s/..." style="font-size:12px"/>
        <button onclick="saveScriptUrlDesktop()" style="font-size:12px">Save</button>
      </div>
    </div>

    <div>
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Log expense</div>
      <div class="input-wrap" style="margin:0 0 6px">
        <input id="mainInputDesktop" type="text" placeholder='Rapido 111 or Juice 143' autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')addExpenseFrom('desktop')"/>
        <button class="add-btn" onclick="addExpenseFrom('desktop')" aria-label="Add expense">+</button>
      </div>
      <div class="date-row" style="margin:0">
        <button class="date-chip active" id="chip-today-d" onclick="setLogDate('today')">Today</button>
        <button class="date-chip" id="chip-yesterday-d" onclick="setLogDate('yesterday')">Yesterday</button>
        <div class="date-picker-wrap">
          <button class="date-chip" id="chip-custom-d" onclick="document.getElementById('customDateInputDesktop').showPicker ? document.getElementById('customDateInputDesktop').showPicker() : document.getElementById('customDateInputDesktop').click()">📅 Pick</button>
          <input type="date" id="customDateInputDesktop" onchange="setLogDateDesktop()"/>
        </div>
      </div>
      <div class="log-result" id="logResultDesktop" style="margin:6px 0 0"></div>
    </div>

    <div class="sidebar-recents">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Recent</div>
      <div id="desktopRecentList"></div>
    </div>

    <div class="sidebar-nav">
      <button class="nav-item active" id="nav-analytics" onclick="setDesktopView('analytics',this)">
        <i class="ti ti-chart-pie" aria-hidden="true"></i> Analytics
      </button>
      <button class="nav-item" id="nav-rules" onclick="setDesktopView('rules',this)">
        <i class="ti ti-brain" aria-hidden="true"></i> Rules
      </button>
      <button class="nav-item" id="nav-review" onclick="setDesktopView('review',this)">
        <i class="ti ti-alert-circle" aria-hidden="true"></i> Review
        <span id="desktopReviewBadge" style="display:none;background:var(--red);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:99px;margin-left:auto;display:none;align-items:center;justify-content:center;font-weight:600"></span>
      </button>
    </div>
  </div>

  <!-- Desktop main panel -->
  <div class="main-panel desktop-only" id="desktopMainPanel">
    <!-- Analytics view -->
    <div id="desktop-analytics">
      <div class="desktop-metrics">
        <div class="metric"><div class="metric-label">Today</div><div class="metric-val accent" id="dm-today">₹0</div></div>
        <div class="metric"><div class="metric-label">This week</div><div class="metric-val" id="dm-week">₹0</div></div>
        <div class="metric"><div class="metric-label">This month</div><div class="metric-val" id="dm-month">₹—</div></div>
        <div class="metric"><div class="metric-label">Entries</div><div class="metric-val" id="dm-count">0</div></div>
      </div>
      <div class="desktop-charts">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Category breakdown</div>
          <canvas id="donutCanvasD" width="110" height="110" style="flex-shrink:0"></canvas>
          <div id="donutLegendD" style="font-size:13px;margin-top:8px"></div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Daily spending</div>
          <div id="dailyBarsD"></div>
        </div>
      </div>
      <div class="desktop-trend">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Trend</div>
        <canvas id="trendCanvasD" width="320" height="80" style="width:100%;height:80px"></canvas>
        <div id="trendStatsD" style="display:flex;justify-content:space-between;margin-top:10px"></div>
      </div>
    </div>
    <!-- Rules view -->
    <div id="desktop-rules" style="display:none">
      <div style="font-size:16px;font-weight:500;margin-bottom:1rem">Learned Rules</div>
      <div class="card" style="margin-bottom:1rem">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Google Sheets connection</div>
        <div id="currentUrlStatusD" style="font-size:12px;color:var(--muted);margin-bottom:10px;word-break:break-all"></div>
        <div style="display:flex;gap:8px">
          <input type="url" id="editScriptUrl
